---
# Grafana admin credentials — SealedSecret in the MONITORING namespace.
#
# A-4 fix: the previous config referenced bank-mall-secret (bank-mall ns) from
# a deployment in the monitoring ns, which can never resolve (secretKeyRef is
# namespace-scoped) → Grafana fell back to default admin/admin.
#
# HOW TO SEAL (run against the cluster — the encryptedData below must be
# produced by the cluster's sealed-secrets controller, it cannot be forged
# offline):
#   kubectl create secret generic grafana-secret \
#     --namespace monitoring \
#     --from-literal=GRAFANA_ADMIN_PASSWORD='<choose-a-strong-password>' \
#     --dry-run=client -o yaml | \
#     kubeseal --format yaml --namespace monitoring > grafana-sealedsecret.yaml
# Then apply and the controller will mint the Secret.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  creationTimestamp: null
  name: grafana-secret
  namespace: monitoring
spec:
  encryptedData:
    GRAFANA_ADMIN_PASSWORD: PLACEHOLDER_REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      creationTimestamp: null
      labels:
        app.kubernetes.io/part-of: bank-mall
      name: grafana-secret
      namespace: monitoring
    type: Opaque
